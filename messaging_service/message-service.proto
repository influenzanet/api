syntax = "proto3";

package influenzanet.message_service;
option go_package = "github.com/influenzanet/messaging-service/pkg/api/messaging_service";

import "google/protobuf/empty.proto";
import "shared/auth_info.proto";

service MessagingServiceApi {
  rpc Status(google.protobuf.Empty) returns (ServiceStatus);

  rpc SendInstantEmail(SendEmailReq) returns (ServiceStatus);
  rpc QueueEmailTemplateForSending(SendEmailReq) returns (ServiceStatus);
  rpc SendMessageToAllUsers(SendMessageToAllUsersReq) returns (ServiceStatus);
  rpc SendMessageToStudyParticipants(SendMessageToStudyParticipantsReq)
      returns (ServiceStatus);

  rpc GetAutoMessages(GetAutoMessagesReq) returns (AutoMessages);
  rpc SaveAutoMessage(SaveAutoMessageReq) returns (AutoMessage);
  rpc DeleteAutoMessage(DeleteAutoMessageReq) returns (ServiceStatus);

  rpc GetEmailTemplates(GetEmailTemplatesReq) returns (EmailTemplates);
  rpc SaveEmailTemplate(SaveEmailTemplateReq) returns (EmailTemplate);
  rpc DeleteEmailTemplate(DeleteEmailTemplateReq) returns (ServiceStatus);

  // Service to service: called by user-management whenever a participant withdraws WhatsApp.
  rpc DeleteOutgoingWhatsAppForUser(DeleteOutgoingWhatsAppForUserReq)
      returns (DeleteOutgoingWhatsAppForUserResp);

  // Service to service: called by the gateway with the body of a WhatsApp webhook request whose
  // signature it has checked. The delivery statuses and the replies in it are processed before
  // the call returns, and processing the same body again changes nothing. Errors:
  // InvalidArgument, not a webhook payload (delivering it again cannot help); FailedPrecondition,
  // the webhook is not configured here; Unavailable, part of it could not be processed yet. On
  // the last two the gateway answers Meta with an error, so that Meta sends the body again.
  rpc ProcessWhatsAppWebhook(ProcessWhatsAppWebhookReq) returns (google.protobuf.Empty);
}

/*
 * Status is typically used as a return value indicating if the method was
 * performed normally, or the system has any internal error e.g. checking system
 * status of a service
 */
message ServiceStatus {
  enum StatusValue {
    NORMAL = 0;
    PROBLEM = 1;
  }
  StatusValue status = 1;
  string msg = 2;
  string version = 3;
}

message SendMessageToAllUsersReq {
  influenzanet.shared.TokenInfos token = 1;
  EmailTemplate template = 2;
  bool ignore_weekday = 3;
  string label = 4; // short description for message intent, default if empty
}

message SendMessageToStudyParticipantsReq {
  influenzanet.shared.TokenInfos token = 1;
  EmailTemplate template = 2;
  string study_key = 3;
  ExpressionArg condition = 4;
  bool ignore_weekday = 5;
  string label = 6; // short description for message intent, default if empty
}

message SendEmailReq {
  string instance_id = 1;
  repeated string to = 2;
  string message_type = 3;
  string study_key = 4;
  string preferred_language = 5;
  map<string, string> content_infos = 6;
  bool use_low_prio = 7;
}

message AutoMessage {
  string id = 1;
  EmailTemplate template = 2;
  string type = 3; // all-users - study-participants
  string study_key = 4;
  ExpressionArg condition = 5;
  int64 next_time = 6; // when is the next time the message should be triggered
  int64 period = 7;    // how often it should be triggered
  string label = 8; // short description to describe intent of the message
  int64 until = 9; // optional value, after this the auto-message will be deleted
}

message AutoMessages { repeated AutoMessage auto_messages = 1; }

message GetAutoMessagesReq { influenzanet.shared.TokenInfos token = 1; }
message SaveAutoMessageReq {
  influenzanet.shared.TokenInfos token = 1;
  AutoMessage auto_message = 2;
}

message DeleteAutoMessageReq {
  influenzanet.shared.TokenInfos token = 1;
  string auto_message_id = 2;
}

message EmailTemplate {
  string id = 1;
  string message_type = 2;
  string study_key = 3;
  string default_language = 4;
  repeated LocalizedTemplate translations = 5;
  HeaderOverrides header_overrides = 6;
  // Binding to the WhatsApp template this message is delivered with. Both fields are
  // optional: whatsapp_template_name carries explicit presence, so a client that omits it
  // asks the server to keep the binding already stored, while sending it empty clears the
  // binding together with its parameters.
  optional string whatsapp_template_name = 7;
  // Maps a parameter of the Meta template to the content key that fills it.
  map<string, string> whatsapp_params = 8;
}

message HeaderOverrides {
  string from = 1;
  string sender = 2;
  repeated string reply_to = 3;
  bool no_reply_to = 4;
}

message LocalizedTemplate {
  string lang = 1;
  string template_def = 2;
  string subject = 3;
}

message EmailTemplates { repeated EmailTemplate templates = 1; }

message GetEmailTemplatesReq { influenzanet.shared.TokenInfos token = 1; }

message SaveEmailTemplateReq {
  influenzanet.shared.TokenInfos token = 1;
  EmailTemplate template = 2;
}

message DeleteEmailTemplateReq {
  influenzanet.shared.TokenInfos token = 1;
  string study_key = 2;
  string message_type = 3;
}

message Expression {
  string name = 1;
  string returnType = 2;
  repeated ExpressionArg data = 3;
}

message ExpressionArg {
  string dtype = 1;
  oneof data {
    Expression exp = 2;
    string str = 3;
    double num = 4;
  }
}

// Removes the WhatsApp messages queued for one participant. Repeating a call is harmless, so
// the caller may retry it.
message DeleteOutgoingWhatsAppForUserReq {
  string instance_id = 1;
  string user_id = 2;
  // Message types to cancel; empty means every type.
  repeated string message_types = 3;
  // Account deletion: delete the queued messages without archiving them, together with every
  // archived message of the participant. message_types must then be empty.
  bool purge_archive = 4;
}

message DeleteOutgoingWhatsAppForUserResp {
  // Queued messages taken out of the queue.
  int64 removed_from_queue = 1;
  // Archived messages deleted (purge_archive only).
  int64 removed_from_archive = 2;
}

message ProcessWhatsAppWebhookReq {
  // The request body exactly as Meta sent it: the bytes the signature was computed on.
  bytes payload = 1;
}
